services:
  - type: web
    name: ripple-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        value: "6379"
      - key: FALKORDB_PASSWORD
        sync: false
      - key: RIPPLE_GRAPH_NAME
        value: ripple_demo
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /api/health
