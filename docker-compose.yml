version: "3.8"

services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH=ripple_graph
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEV_MOCKS=false
      - CORS_ORIGINS=http://localhost:5173
    volumes:
      - ./backend:/app/backend
    depends_on:
      falkordb:
        condition: service_healthy

volumes:
  falkordb_data:
