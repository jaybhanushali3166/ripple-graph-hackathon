name: Deploy Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build and verify frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run typecheck
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify Python backend (if tests present)
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/pyproject.toml ]; then
            pip install -e backend/ pytest pytest-asyncio
            if [ -d tests ]; then
              pytest tests/ -v
            fi
          fi

  deploy-render:
    name: Deploy to Render (All-in-One Fullstack)
    needs: verify
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice ::RENDER_DEPLOY_HOOK_URL secret not configured. Skipping Render deploy."
            exit 0
          fi
          echo "Triggering zero-downtime deployment on Render via Deploy Hook..."
          response=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Render deploy successfully triggered! (HTTP $http_code)"
          else
            echo "::error ::Failed to trigger Render deploy hook. HTTP $http_code: $body"
            exit 1
          fi

  deploy-railway:
    name: Deploy to Railway (Alternative)
    needs: verify
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout repository
        if: ${{ env.RAILWAY_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Deploy via Railway CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice ::RAILWAY_TOKEN secret not configured. Skipping Railway deploy."
            exit 0
          fi
          npm install -g @railway/cli
          railway up --detach

  deploy-vercel:
    name: Deploy Frontend to Vercel (Optional Standalone CDN)
    needs: verify
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout repository
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice ::VERCEL_TOKEN secret not configured. Skipping standalone Vercel deploy."
            exit 0
          fi
          cd frontend
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          npx vercel build --prod --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
